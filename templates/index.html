<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- "ChAT" is intentional — it spells CAT, matching the 🐱 header mascot. -->
  <title>Local LLM ChAT</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <!--
    Every CDN asset below carries a Subresource Integrity hash, so a tampered
    or swapped file on the CDN is refused by the browser rather than executed.
    DOMPurify in particular is what sanitizes assistant Markdown before it is
    written as HTML, so silently substituting it would defeat that defense.
    Hashes are cdnjs's own published sha512 values; when bumping a version,
    fetch the new one from https://api.cdnjs.com/libraries/<lib>/<ver>?fields=sri
    rather than dropping the attribute.
  -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/styles/github.min.css"
    integrity="sha512-0aPQyyeZrWj9sCA46UlmWgKOP0mUipLQ6OZXu8l4IcAmD2u31EPEy9VcIMvl7SoAaKe8bLXZhYoMaE/in+gcgA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
    media="(prefers-color-scheme: light)"
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/styles/github-dark.min.css"
    integrity="sha512-rO+olRTkcf304DQBxSWxln8JXCzTHlKnIdnMUwYvQa9/Jd4cQaNkItIUj6Z4nvW1dqK0SKXLbn9h4KwZTNtAyw=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
    media="(prefers-color-scheme: dark)"
  />
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/marked/18.0.10/lib/marked.umd.min.js"
    integrity="sha512-BXBF2VjQU8N1VwZXChMTvB49voK+BRHl8NnXMXbda1RQ5nguKxDl8406wy6opMqBoGuPIDm2mD+Db37I3CuM8A=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  ></script>
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.14/purify.min.js"
    integrity="sha512-+G1tsz5n01KTeX7oUT/Lm5P2B+n9RUogC98t4E8MseH9YUac2D2uPaNSbsYDOOSZr2YQ1BfeCxk8KXZXvhctEA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  ></script>
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/highlight.min.js"
    integrity="sha512-VSPLUv/n1Bmn+4zoxBNwpuFAO3//79I0Aax/qHDx24R47vylPcc9PrHDCqlePwHnh3joiM7/YTQhcXyQAAxvPQ=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  ></script>
  <script>
    // Only the LaTeX-native delimiters are configured: script.js re-emits every
    // math span it finds with these, so MathJax never has to guess at stray
    // dollar signs in ordinary prose.
    window.MathJax = {
      tex: {
        inlineMath: [["\\(", "\\)"]],
        displayMath: [["\\[", "\\]"]],
      },
      options: { enableMenu: false },
      startup: {
        typeset: false,
        pageReady: () =>
          MathJax.startup.defaultPageReady().then(() => {
            window.mathJaxPageReady = true;
            document.dispatchEvent(new Event("mathjax-ready"));
          }),
      },
    };
  </script>
  <!--
    SRI covers this entry bundle only; MathJax pulls its own font data from the
    same CDN path at runtime, which integrity attributes cannot reach.
  -->
  <script
    async
    src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js"
    integrity="sha512-tiaNmAzpy3KcgtuiLwT9WSlSsqGqtDB5ylMwxoqG5ysNIyzkBw24k6UFTuXGgyXJLJ8aM/ho1h67NRKedPx++Q=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  ></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <button id="new-chat-btn" class="new-chat-btn">+ New chat</button>
      <div id="chat-list" class="chat-list"></div>
      <div class="sidebar-footer">
        <div class="model-label-row">
          <label for="model-select">Model</label>
          <label class="switch" title="Show only free models">
            <input type="checkbox" id="free-only-toggle" />
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </label>
        </div>
        <select id="model-select" data-default-model="{{ default_model }}">
          <option value="{{ default_model }}">{{ default_model }}</option>
        </select>
      </div>
    </aside>

    <main class="main">
      <header class="app-header"><span class="cat">🐱</span> Local LLM ChAT</header>
      <div class="watermark-cat" aria-hidden="true">🐱</div>
      <div id="messages" class="messages">
        <div class="empty-state">
          <h1>What can I help with?</h1>
          <p>Pick a model on the left and start typing below.</p>
        </div>
      </div>

      <form id="chat-form" class="composer">
        <div id="attachment-preview" class="attachment-preview" hidden></div>
        <div class="composer-row">
          <input
            type="file"
            id="file-input"
            hidden
            accept=".txt,.md,.markdown,.csv,.json,.log,.py,.js,.ts,.jsx,.tsx,.html,.css,.yml,.yaml,.xml,.pdf,image/*"
          />
          <button type="button" id="export-pdf-btn" class="icon-btn" aria-label="Export chat as PDF" title="Export this chat as a PDF" disabled>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 3v12" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M7 10l5 5 5-5" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M4 19h16" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <button type="button" id="attach-btn" class="icon-btn" aria-label="Attach a file" title="Attach a text file, PDF, or image">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path
                d="M21.44 11.05l-9.19 9.19a5 5 0 01-7.07-7.07l9.19-9.19a3.5 3.5 0 014.95 4.95l-9.19 9.19a2 2 0 01-2.83-2.83l8.49-8.48"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <textarea
            id="prompt-input"
            placeholder="Message the model..."
            rows="1"
            autofocus
          ></textarea>
          <button id="send-btn" type="submit" aria-label="Send">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 19V5M5 12l7-7 7 7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
      </form>
    </main>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
