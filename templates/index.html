<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local LLM ChAT</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/18.0.10/lib/marked.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.14/purify.min.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <button id="new-chat-btn" class="new-chat-btn">+ New chat</button>
      <div id="chat-list" class="chat-list"></div>
      <div class="sidebar-footer">
        <div class="model-label-row">
          <label for="model-select">Model</label>
          <label class="switch" title="Show only free models">
            <input type="checkbox" id="free-only-toggle" />
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </label>
        </div>
        <select id="model-select">
          <option value="{{ default_model }}">{{ default_model }}</option>
        </select>
      </div>
    </aside>

    <main class="main">
      <header class="app-header"><span class="cat">🐱</span> Local LLM ChAT</header>
      <div class="watermark-cat" aria-hidden="true">🐱</div>
      <div id="messages" class="messages">
        <div class="empty-state">
          <h1>What can I help with?</h1>
          <p>Pick a model on the left and start typing below.</p>
        </div>
      </div>

      <form id="chat-form" class="composer">
        <div id="attachment-preview" class="attachment-preview" hidden></div>
        <div class="composer-row">
          <input
            type="file"
            id="file-input"
            hidden
            accept=".txt,.md,.markdown,.csv,.json,.log,.py,.js,.ts,.jsx,.tsx,.html,.css,.yml,.yaml,.xml,.pdf,image/*"
          />
          <button type="button" id="export-pdf-btn" class="icon-btn" aria-label="Export chat as PDF" title="Export this chat as a PDF" disabled>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M14 2v6h6" stroke-linecap="round" stroke-linejoin="round" />
              <text x="12" y="18" font-size="7" font-weight="700" text-anchor="middle" stroke="none" fill="currentColor">PDF</text>
            </svg>
          </button>
          <button type="button" id="attach-btn" class="icon-btn" aria-label="Attach a file" title="Attach a text file, PDF, or image">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path
                d="M21.44 11.05l-9.19 9.19a5 5 0 01-7.07-7.07l9.19-9.19a3.5 3.5 0 014.95 4.95l-9.19 9.19a2 2 0 01-2.83-2.83l8.49-8.48"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <textarea
            id="prompt-input"
            placeholder="Message the model..."
            rows="1"
            autofocus
          ></textarea>
          <button id="send-btn" type="submit" aria-label="Send">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 19V5M5 12l7-7 7 7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
      </form>
    </main>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
