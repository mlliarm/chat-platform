name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No secrets are needed anywhere in this file: the backend suite mocks every
# OpenRouter call, and the e2e suite intercepts them in the browser.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: pytest
        run: pytest

      - name: mypy
        run: mypy

  frontend:
    name: Frontend (vitest + playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        # The e2e tier boots the real Flask app as its web server.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Vitest unit tests
        run: npm run test:unit

      - name: Playwright e2e tests
        # FLASK_BIN overrides playwright.config.js's local `venv/bin/flask`
        # default, since CI installs into the job environment directly.
        env:
          FLASK_BIN: flask
        run: npm run test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
